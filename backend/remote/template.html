<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>May Remote</title>
<style>
  :root {
    --bg: #0D0D0D;
    --surface: #1A1A1A;
    --surface-elevated: #252525;
    --border: #2E2E2E;
    --accent: #06B6D4;
    --accent-dim: rgba(6,182,212,0.15);
    --success: #4ADE80;
    --warning: #F59E0B;
    --danger: #EF4444;
    --text: #E5E5E5;
    --text-muted: #666666;
    --purple: #8B5CF6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  /* Header */
  .header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .avatar-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-dim); }
    50% { box-shadow: 0 0 12px 4px var(--accent-dim); }
  }
  .header-info { flex: 1; }
  .header-info h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-info .status {
    font-size: 11px; color: var(--success);
    display: flex; align-items: center; gap: 4px;
  }
  .header-info .status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  /* Quick Actions */
  .quick-actions {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .quick-actions::-webkit-scrollbar { display: none; }
  .quick-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 16px;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .quick-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  /* Chat */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #000;
    border-bottom-right-radius: 4px;
  }
  .msg.may {
    align-self: flex-start;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    background: rgba(239,68,68,0.1);
    border-color: var(--danger);
    color: var(--danger);
    font-size: 12px;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    align-self: flex-start;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
  /* Input */
  .input-bar {
    padding: 8px 12px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .input-bar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-elevated);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #000;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar-dot">🌸</div>
  <div class="header-info">
    <h1>May</h1>
    <div class="status" id="status">Connected</div>
  </div>
</div>

<div class="quick-actions" id="quickActions">
  <button class="quick-btn" onclick="send('volume up')">🔊 Vol Up</button>
  <button class="quick-btn" onclick="send('volume down')">🔉 Vol Down</button>
  <button class="quick-btn" onclick="send('mute')">🔇 Mute</button>
  <button class="quick-btn" onclick="send('what time is it')">🕐 Time</button>
  <button class="quick-btn" onclick="send('weather')">🌤 Weather</button>
  <button class="quick-btn" onclick="send('open chrome')">🌐 Chrome</button>
  <button class="quick-btn" onclick="send('system info')">💻 System</button>
  <button class="quick-btn" onclick="send('battery info')">🔋 Battery</button>
  <button class="quick-btn" onclick="send('screenshot')">📸 Screenshot</button>
  <button class="quick-btn" onclick="send('lock pc')">🔒 Lock</button>
</div>

<div class="chat" id="chat">
  <div class="msg may">Hey~ Remote control connected. What would you like me to do?</div>
</div>

<div class="input-bar">
  <input
    type="text"
    id="msgInput"
    placeholder="Type a message..."
    autocomplete="off"
    enterkeyhint="send"
  />
  <button class="send-btn" id="sendBtn" onclick="sendFromInput()">↑</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  let ws = null;
  let isProcessing = false;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/remote`);

    ws.onopen = () => {
      statusEl.textContent = 'Connected';
      statusEl.style.color = 'var(--success)';
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'response') {
        removeTyping();
        addMessage('may', data.content);
        isProcessing = false;
        sendBtn.disabled = false;
      } else if (data.type === 'status') {
        statusEl.textContent = data.text || 'Connected';
      }
    };

    ws.onclose = () => {
      statusEl.textContent = 'Reconnecting...';
      statusEl.style.color = 'var(--warning)';
      setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  function send(text) {
    if (!text || isProcessing) return;
    isProcessing = true;
    sendBtn.disabled = true;
    addMessage('user', text);
    showTyping();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'message', content: text }));
    }
  }

  function sendFromInput() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendFromInput();
    }
  });

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = content;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  connect();
  input.focus();
</script>
</body>
</html>
